name: nutrifit_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0' # Updated SDK constraint for clarity

dependencies:
  flutter:
    sdk: flutter

  # Core Utility Packages
  provider: ^6.1.2 # Updated to latest major
  http: ^1.6.0 # Updated to latest major

  # Data/Caching
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3 # Updated to latest major

  # UI / Icons
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0 # Updated to latest major

  # --- Firebase Packages (Updated to recent compatible versions) ---
  # Note: These versions are from the FlutterFire v14 release
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Image/Camera/AI
  image_picker: ^1.2.1 # Updated to latest major
  google_generative_ai: 0.4.7 # Updated to latest major
  camera: ^0.11.0+1
  google_mlkit_image_labeling: ^0.12.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  flutter_markdown: ^0.7.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/